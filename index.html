<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sales Dashboard España</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a2e}
header{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-size:1.4rem;font-weight:700}
header span{font-size:.8rem;opacity:.6}
.filters{background:#fff;padding:13px 32px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #e8e8e8;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.filters label{font-size:.82rem;font-weight:600;color:#555}
select{padding:7px 11px;border:1px solid #ddd;border-radius:7px;font-size:.82rem;cursor:pointer;background:#fafafa}
.sep{color:#ccc;font-size:1.2rem}
.btn{padding:7px 16px;background:#4361ee;color:#fff;border:none;border-radius:7px;font-size:.82rem;cursor:pointer;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:13px;padding:20px 32px 6px}
.kpi{background:#fff;border-radius:12px;padding:16px 18px;box-shadow:0 2px 10px rgba(0,0,0,.06);border-left:4px solid #4361ee}
.kpi.g{border-color:#2ecc71}.kpi.a{border-color:#f39c12}.kpi.r{border-color:#e74c3c}.kpi.p{border-color:#9b59b6}
.kpi-label{font-size:.7rem;color:#999;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.kpi-value{font-size:1.5rem;font-weight:800;line-height:1.1}
.kpi-sub{font-size:.72rem;color:#bbb;margin-top:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:10px 32px 32px}
.box{background:#fff;border-radius:12px;padding:20px 22px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.box.full{grid-column:1/-1}
.box-title{font-size:.9rem;font-weight:700;color:#333;margin-bottom:16px;display:flex;align-items:center;gap:7px}
.tag{background:#f0f3ff;color:#4361ee;padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:.79rem}
th{background:#f7f8ff;padding:9px 11px;text-align:left;font-weight:700;color:#555;border-bottom:2px solid #e8ecff;white-space:nowrap}
td{padding:8px 11px;border-bottom:1px solid #f2f2f2;white-space:nowrap}
tr:hover td{background:#fafbff}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.75rem;font-weight:700}
.pos{background:#e8f8f0;color:#27ae60}.neg{background:#fef0f0;color:#e74c3c}
@media(max-width:720px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <h1>📊 Sales Dashboard — España</h1>
  <span id="ts"></span>
</header>
<div class="filters">

  <select id="monDesde" onchange="render()"></select>
  <span class="sep">→</span>
  <label>Hasta:</label>
  <select id="monHasta" onchange="render()"></select>
</div>
<div id="app"></div>

const ALL_MESES=['01/2025','02/2025','03/2025','04/2025','05/2025','06/2025','07/2025','08/2025','09/2025','10/2025','11/2025','12/2025','01/2026','02/2026','03/2026','04/2026','05/2026'];
const MLABEL={'01/2025':'Ene 25','02/2025':'Feb 25','03/2025':'Mar 25','04/2025':'Abr 25','05/2025':'May 25','06/2025':'Jun 25','07/2025':'Jul 25','08/2025':'Ago 25','09/2025':'Sep 25','10/2025':'Oct 25','11/2025':'Nov 25','12/2025':'Dic 25','01/2026':'Ene 26','02/2026':'Feb 26','03/2026':'Mar 26','04/2026':'Abr 26','05/2026':'May 26'};
const MESES_2026=['01/2026','02/2026','03/2026','04/2026','05/2026'];
const COLORS=['#4361ee','#e63946','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#3498db','#e91e63','#00b4d8','#588157','#bc6c25'];
let charts={};

function getRow(cat,kpi){return rows.find(r=>r.cat===cat&&r.kpi===kpi);}
function getV(cat,kpi,mes){
  const r=getRow(cat,kpi); if(!r)return 0;
  const k=mes.includes('2025')?mes:(mes+'/Total');
  return Number(r[k])||0;
}
function getYoY(cat,mes){
  const r=getRow(cat,'NR'); if(!r)return '';
  return r[mes+'/YoY']||'';
}
const fE=n=>n?new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n):'—';
const fN=n=>new Intl.NumberFormat('es-ES',{maximumFractionDigits:0}).format(n||0);
function cats(){return[...new Set(rows.map(r=>r.cat))];}
function fCats(){const v=document.getElementById('catSel').value;return v==='all'?cats():[v];}
function selMeses(){
  const d=document.getElementById('monDesde').value,h=document.getElementById('monHasta').value;
  const di=ALL_MESES.indexOf(d),hi=ALL_MESES.indexOf(h);
  return(di<0||hi<0||di>hi)?ALL_MESES:ALL_MESES.slice(di,hi+1);
}
function lastM(){const s=selMeses();return s[s.length-1];}
function destroyC(){Object.values(charts).forEach(c=>c.destroy());charts={};}

function setup(){
  const cs=cats();
  document.getElementById('catSel').innerHTML='<option value="all">Todas</option>'+cs.map(c=>`<option value="${c}">${c}</option>`).join('');
  const opts=ALL_MESES.map(m=>`<option value="${m}">${MLABEL[m]}</option>`).join('');
  document.getElementById('monDesde').innerHTML=opts;
  document.getElementById('monHasta').innerHTML=opts;
  document.getElementById('monDesde').value='01/2025';
  const avail=MESES_2026.filter(m=>cs.some(c=>getV(c,'NR',m)>0));
  document.getElementById('monHasta').value=avail.length?avail[avail.length-1]:'05/2026';
  document.getElementById('ts').textContent='Datos: Mayo 2026';
  render();
}

function render(){
  destroyC();
  const fc=fCats(),meses=selMeses(),lm=lastM(),lmL=MLABEL[lm]||lm,mL=meses.map(m=>MLABEL[m]);
  document.getElementById('app').innerHTML=`
    <div class="kpis" id="kpis"></div>
    <div class="grid">
      <div class="box full"><div class="box-title">📈 NR por categoría <span class="tag">evolución · €</span></div><canvas id="cNR" height="85"></canvas></div>
      <div class="box"><div class="box-title">📊 YoY NR <span class="tag">${lmL}</span></div><canvas id="cYoY" height="180"></canvas></div>
      <div class="box"><div class="box-title">🎯 Selling Rate % <span class="tag">${lmL}</span></div><canvas id="cSR" height="180"></canvas></div>
      <div class="box full"><div class="box-title">🛒 Con Compra — evolución</div><canvas id="cCC" height="85"></canvas></div>
      <div class="box full"><div class="box-title">💰 ARPA <span class="tag">evolución · €</span></div><canvas id="cARPA" height="85"></canvas></div>
      <div class="box full"><div class="box-title">📋 Tabla resumen <span class="tag">${lmL}</span></div><div id="tbl"></div></div>
    </div>`;

  const totNR=fc.reduce((s,c)=>s+getV(c,'NR',lm),0);
  const totBase=fc.reduce((s,c)=>s+getV(c,'Total Base',lm),0);
  const totCC=fc.reduce((s,c)=>s+getV(c,'Con Compra',lm),0);
  const totCap=fc.reduce((s,c)=>s+getV(c,'Captación nuevos',lm),0);
  const avgSR=fc.length?fc.reduce((s,c)=>s+getV(c,'Selling Rate %',lm),0)/fc.length:0;

  document.getElementById('kpis').innerHTML=`
    <div class="kpi"><div class="kpi-label">NR Total</div><div class="kpi-value">${fE(totNR)}</div><div class="kpi-sub">${lmL}</div></div>
    <div class="kpi g"><div class="kpi-label">Total Base</div><div class="kpi-value">${fN(totBase)}</div><div class="kpi-sub">clientes</div></div>
    <div class="kpi a"><div class="kpi-label">Con Compra</div><div class="kpi-value">${fN(totCC)}</div><div class="kpi-sub">${lmL}</div></div>
    <div class="kpi p"><div class="kpi-label">Captación nuevos</div><div class="kpi-value">${fN(totCap)}</div><div class="kpi-sub">${lmL}</div></div>
    <div class="kpi r"><div class="kpi-label">Selling Rate medio</div><div class="kpi-value">${(avgSR*100).toFixed(1)}%</div><div class="kpi-sub">promedio</div></div>`;

  charts.cNR=new Chart(document.getElementById('cNR'),{type:'line',data:{labels:mL,datasets:fc.map((c,i)=>({label:c,data:meses.map(m=>getV(c,'NR',m)),borderColor:COLORS[i%COLORS.length],backgroundColor:COLORS[i%COLORS.length]+'15',tension:.35,fill:false,pointRadius:4,borderWidth:2.5}))},options:{responsive:true,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11},padding:14}}},scales:{y:{ticks:{callback:v=>'€'+fN(v)},grid:{color:'#f5f5f5'}},x:{grid:{display:false}}}}});

  const yV=fc.map(c=>{const r=getYoY(c,lm);return r?parseFloat(r.replace('%','').replace(',','.'))||0:0;});
  charts.cYoY=new Chart(document.getElementById('cYoY'),{type:'bar',data:{labels:fc,datasets:[{data:yV,backgroundColor:yV.map(v=>v>=0?'#2ecc7199':'#e74c3c99'),borderColor:yV.map(v=>v>=0?'#2ecc71':'#e74c3c'),borderWidth:1.5,borderRadius:5}]},options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.raw.toFixed(1)+'%'}}},scales:{x:{ticks:{callback:v=>v+'%'},grid:{color:'#f5f5f5'}},y:{grid:{display:false}}}}});

  charts.cSR=new Chart(document.getElementById('cSR'),{type:'bar',data:{labels:fc,datasets:[{data:fc.map(c=>getV(c,'Selling Rate %',lm)*100),backgroundColor:COLORS.map(c=>c+'aa'),borderWidth:0,borderRadius:5}]},options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.raw.toFixed(1)+'%'}}},scales:{x:{max:100,ticks:{callback:v=>v+'%'},grid:{color:'#f5f5f5'}},y:{grid:{display:false}}}}});

  charts.cCC=new Chart(document.getElementById('cCC'),{type:'bar',data:{labels:mL,datasets:fc.map((c,i)=>({label:c,data:meses.map(m=>getV(c,'Con Compra',m)),backgroundColor:COLORS[i%COLORS.length]+'cc',borderRadius:3}))},options:{responsive:true,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11},padding:14}}},scales:{x:{grid:{display:false}},y:{grid:{color:'#f5f5f5'}}}}});

  charts.cARPA=new Chart(document.getElementById('cARPA'),{type:'line',data:{labels:mL,datasets:fc.map((c,i)=>({label:c,data:meses.map(m=>getV(c,'ARPA',m)),borderColor:COLORS[i%COLORS.length],backgroundColor:COLORS[i%COLORS.length]+'15',tension:.35,fill:false,pointRadius:4,borderWidth:2.5}))},options:{responsive:true,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11},padding:14}}},scales:{y:{ticks:{callback:v=>'€'+fN(v)},grid:{color:'#f5f5f5'}},x:{grid:{display:false}}}}});

  const kpis=['Total Base','Captación nuevos','Con Compra','NR','ARPA','Selling Rate %'];
  let t=`<table><thead><tr><th>Categoría</th>${kpis.map(k=>`<th>${k}</th>`).join('')}<th>YoY NR</th></tr></thead><tbody>`;
  fc.forEach(c=>{
    t+=`<tr><td><strong>${c}</strong></td>`;
    kpis.forEach(k=>{
      const v=getV(c,k,lm);
      const d=k==='NR'||k==='ARPA'?fE(v):k.includes('%')?(v*100).toFixed(1)+'%':fN(v);
      t+=`<td>${d}</td>`;
    });
    const yr=getYoY(c,lm);
    const yn=yr?parseFloat(yr.replace('%','').replace(',','.'))||0:0;
    t+=`<td><span class="badge ${yn>=0?'pos':'neg'}">${yr||'—'}</span></td></tr>`;
  });
  t+='</tbody></table>';
  document.getElementById('tbl').innerHTML=t;
}

setup();
</script>
